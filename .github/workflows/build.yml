name: Build NewCart single plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newcart-paper-1-21-4-runtime
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Fetch pinned CustomWorldHeight engine for embedding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p libs
          curl --fail --location --retry 3 \
            "https://github.com/Lumine1909/CustomWorldHeight/releases/download/v1.5.1-build-1/CustomWorldHeight-1.5.1-MC-1.20.5-1.21.7.jar" \
            --output libs/CustomWorldHeight.jar
          test -s libs/CustomWorldHeight.jar
          jar tf libs/CustomWorldHeight.jar | grep -q 'io/github/lumine1909/customworldheight/CustomWorldHeight.class'
          jar tf libs/CustomWorldHeight.jar | grep -q 'plugin.yml'
      - name: Verify valid Paper 1.21.4 dimension settings
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^  min-y: -176$' src/main/resources/config.yml
          grep -q '^  height: 496$' src/main/resources/config.yml
          grep -q 'NEW_BOTTOM = -176' src/main/java/ru/soscreate/newcart/NewCartPlugin.java
          grep -q 'NEW_HEIGHT = 496' src/main/java/ru/soscreate/newcart/NewCartPlugin.java
          grep -q 'BEDROCK_Y = -164' src/main/java/ru/soscreate/newcart/NewCartPlugin.java
          grep -q 'DEEPSLATE_START = -163' src/main/java/ru/soscreate/newcart/NewCartPlugin.java
          grep -q 'CustomWorldHeight.plugin = this' src/main/java/ru/soscreate/newcart/NewCartPlugin.java
          grep -q 'ChunkLoadEvent' src/main/java/ru/soscreate/newcart/NewCartPlugin.java
          grep -q 'MAX_PENDING_REGION_CHUNKS = 2048' src/main/java/ru/soscreate/newcart/NewCartPlugin.java
          grep -q 'REGION_BATCH_BUFFER_CAPACITY = 4' src/main/java/ru/soscreate/newcart/NewCartPlugin.java
          grep -q 'ArrayBlockingQueue' src/main/java/ru/soscreate/newcart/NewCartPlugin.java
          grep -q 'layersForTps' src/main/java/ru/soscreate/newcart/NewCartPlugin.java
          grep -q 'pause-below-tps: 18.0' src/main/resources/config.yml
          grep -q 'full-speed-at-tps: 19.5' src/main/resources/config.yml
          grep -q 'player-loaded chunk priority' src/main/java/ru/soscreate/newcart/NewCartPlugin.java
          grep -q 'generateDeepslateOres' src/main/java/ru/soscreate/newcart/NewCartPlugin.java
          grep -q 'deepslate_ores_generated_v1' src/main/java/ru/soscreate/newcart/NewCartPlugin.java
          grep -q 'First ore pass finished:' src/main/java/ru/soscreate/newcart/NewCartPlugin.java
          grep -q 'deepslate_migration_cursor_v1' src/main/java/ru/soscreate/newcart/NewCartPlugin.java
          grep -q 'bedrock_floor_generated_v1' src/main/java/ru/soscreate/newcart/NewCartPlugin.java
          grep -q 'runTaskAsynchronously' src/main/java/ru/soscreate/newcart/NewCartPlugin.java
          grep -q 'addPluginChunkTicket' src/main/java/ru/soscreate/newcart/NewCartPlugin.java
          grep -q 'MAX_CHUNK_FAILURES = 8' src/main/java/ru/soscreate/newcart/NewCartPlugin.java
          grep -q 'Migration complete:' src/main/java/ru/soscreate/newcart/NewCartPlugin.java
      - name: Build one self-contained NewCart plugin
        run: gradle --no-daemon clean build
      - name: Verify single-plugin output
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -name 'NewCart-*.jar' -print -quit)"
          test -n "$JAR"
          jar tf "$JAR" | grep -q 'ru/soscreate/newcart/NewCartPlugin.class'
          jar tf "$JAR" | grep -q 'io/github/lumine1909/customworldheight/CustomWorldHeight.class'
          jar tf "$JAR" | grep -q 'io/github/lumine1909/customworldheight/data/DataHandler_1_21_3.class'
          test "$(jar tf "$JAR" | grep -c '^plugin.yml$')" -eq 1
          mkdir -p dist/plugins
          cp "$JAR" dist/plugins/
          (cd dist && zip -r ../NewCart-Paper-1.21.4-Single-Plugin.zip plugins)
          unzip -t NewCart-Paper-1.21.4-Single-Plugin.zip
      - name: Smoke-test on Paper 1.21.4 with an already-created world
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-paper
          PAPER_URL="$(curl --fail --silent --show-error --retry 3 \
            -H 'User-Agent: NewCart-CI/1.0 (GitHub Actions)' \
            "https://fill.papermc.io/v3/projects/paper/versions/1.21.4/builds/232" \
            | jq -r '.downloads["server:default"].url')"
          test -n "$PAPER_URL"
          test "$PAPER_URL" != "null"
          curl --fail --location --retry 3 "$PAPER_URL" --output smoke-paper/paper.jar
          test "$(stat -c%s smoke-paper/paper.jar)" -gt 40000000
          cd smoke-paper
          printf 'eula=true\n' > eula.txt
          cat > server.properties <<'PROPERTIES'
          level-name=world
          server-port=25565
          online-mode=false
          spawn-protection=0
          max-players=1
          view-distance=2
          simulation-distance=2
          spawn-chunk-radius=0
          PROPERTIES
          run_server() {
            local log_file="$1"
            local expected="$2"
            local commands_file="${3:-}"
            local settle_seconds="${4:-3}"
            rm -f server.stdin
            mkfifo server.stdin
            java -Xms512M -Xmx1G -jar paper.jar --nogui < server.stdin > "$log_file" 2>&1 &
            local server_pid=$!
            exec 3>server.stdin
            local ready=0
            for _ in $(seq 1 180); do
              if grep -q "$expected" "$log_file"; then ready=1; break; fi
              if ! kill -0 "$server_pid" 2>/dev/null; then
                cat "$log_file"
                exit 1
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              cat "$log_file"
              kill "$server_pid" 2>/dev/null || true
              exit 1
            fi
            if [ -n "$commands_file" ]; then
              while IFS= read -r command; do
                [ -z "$command" ] && continue
                if [[ "$command" == WAIT:* ]]; then
                  sleep "${command#WAIT:}"
                else
                  echo "$command" >&3
                fi
              done < "$commands_file"
              sleep "$settle_seconds"
            fi
            echo stop >&3
            exec 3>&-
            for _ in $(seq 1 30); do
              if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
            fi
            wait "$server_pid" 2>/dev/null || true
            rm -f server.stdin
          }
          # First boot creates a vanilla Paper 1.21.4 world and saves test blocks.
          cat > create-world-commands.txt <<'COMMANDS'
          execute in minecraft:overworld run forceload add 0 0
          execute in minecraft:overworld run setworldspawn 0 64 0
          execute in minecraft:overworld run setblock 0 -63 0 minecraft:gold_block
          execute in minecraft:overworld run setblock 0 -60 0 minecraft:stone
          COMMANDS
          run_server first-start.log "Done (" create-world-commands.txt
          cat first-start.log
          test -d world
          test -d world/region
          test -s world/region/r.0.0.mca
          mkdir -p plugins
          cp ../build/libs/NewCart-1.0.8.jar plugins/
          # Interrupt a real in-progress chunk after its first persistent checkpoint.
          cat > interrupt-commands.txt <<'COMMANDS'
          WAIT:1
          COMMANDS
          run_server partial-start.log "World height verified: minY=-176 maxY=320" interrupt-commands.txt 0
          cat partial-start.log
          CHECKPOINT_COORDS="$(grep -oE 'Migration checkpoint saved for chunk -?[0-9]+,-?[0-9]+' partial-start.log | head -n 1 | cut -d' ' -f6 | tr ',' ' ')"
          test -n "$CHECKPOINT_COORDS"
          read -r CHECKPOINT_X CHECKPOINT_Z <<< "$CHECKPOINT_COORDS"
          ! grep -q "First chunk migration finished: $CHECKPOINT_X,$CHECKPOINT_Z" partial-start.log
          # Explicitly load the same chunk on the next boot to verify its persisted cursor.
          CHECKPOINT_BLOCK_X=$((CHECKPOINT_X * 16 + 8))
          CHECKPOINT_BLOCK_Z=$((CHECKPOINT_Z * 16 + 8))
          cat > verify-world-commands.txt <<COMMANDS
          WAIT:3
          execute in minecraft:overworld run forceload add $CHECKPOINT_BLOCK_X $CHECKPOINT_BLOCK_Z
          WAIT:12
          execute in minecraft:overworld if block $CHECKPOINT_BLOCK_X -164 $CHECKPOINT_BLOCK_Z minecraft:bedrock run say RESUMED_CHUNK_BEDROCK_OK
          execute in minecraft:overworld unless block $CHECKPOINT_BLOCK_X -163 $CHECKPOINT_BLOCK_Z minecraft:air run say RESUMED_CHUNK_LOWER_LAYER_OK
          execute in minecraft:overworld unless block $CHECKPOINT_BLOCK_X -64 $CHECKPOINT_BLOCK_Z minecraft:air run say RESUMED_CHUNK_TOP_LAYER_OK
          execute in minecraft:overworld if block 0 -164 0 minecraft:bedrock run say BEDROCK_OK
          execute in minecraft:overworld if block 0 -163 0 minecraft:deepslate run say DEEPSLATE_BOTTOM_OK
          execute in minecraft:overworld if block 0 -64 0 minecraft:deepslate run say DEEPSLATE_TOP_OK
          execute in minecraft:overworld if block 0 -63 0 minecraft:gold_block run say ORIGINAL_WORLD_BLOCK_PRESERVED
          execute in minecraft:overworld run forceload add 1024 0
          WAIT:20
          execute in minecraft:overworld if block 1024 -164 0 minecraft:bedrock run say PLAYER_LOADED_CHUNK_BEDROCK_OK
          execute in minecraft:overworld unless block 1024 -163 0 minecraft:air run say PLAYER_LOADED_CHUNK_LOWER_LAYER_OK
          COMMANDS
          run_server newcart-start.log "Done (" verify-world-commands.txt
          cat newcart-start.log
          grep -q "World height verified: minY=-176 maxY=320" newcart-start.log
          grep -q "Resuming chunk $CHECKPOINT_X,$CHECKPOINT_Z from Y=" newcart-start.log
          grep -q "First chunk migration finished: $CHECKPOINT_X,$CHECKPOINT_Z" newcart-start.log
          grep -Eq "First ore pass finished: chunk -?[0-9]+,-?[0-9]+; total=[1-9][0-9]*" newcart-start.log
          grep -q "RESUMED_CHUNK_BEDROCK_OK" newcart-start.log
          grep -q "RESUMED_CHUNK_LOWER_LAYER_OK" newcart-start.log
          grep -q "RESUMED_CHUNK_TOP_LAYER_OK" newcart-start.log
          grep -q "ORIGINAL_WORLD_BLOCK_PRESERVED" newcart-start.log
          grep -q "PLAYER_LOADED_CHUNK_BEDROCK_OK" newcart-start.log
          grep -q "PLAYER_LOADED_CHUNK_LOWER_LAYER_OK" newcart-start.log
          ! grep -q "Error occurred while enabling NewCart" newcart-start.log
          ! grep -q "height has to be multiple of 16" newcart-start.log
      - name: Upload single-plugin package
        uses: actions/upload-artifact@v4
        with:
          name: NewCart-Paper-1.21.4-Single-Plugin
          path: NewCart-Paper-1.21.4-Single-Plugin.zip
          if-no-files-found: error
