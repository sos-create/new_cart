name: Build NewCart

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newcart-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build NewCart plugin
        run: gradle --no-daemon clean build
      - name: Assemble complete server plugin package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/plugins
          cp build/libs/NewCart-*.jar dist/plugins/
          curl --fail --location --retry 3 \
            "https://github.com/Lumine1909/CustomWorldHeight/releases/download/v1.5.1-build-1/CustomWorldHeight-1.5.1-MC-1.20.5-1.21.7.jar" \
            --output dist/plugins/CustomWorldHeight.jar
          test -s dist/plugins/CustomWorldHeight.jar
          jar tf dist/plugins/CustomWorldHeight.jar | grep -q 'plugin.yml'
          jar tf dist/plugins/NewCart-*.jar | grep -q 'plugin.yml'
          (cd dist && zip -r ../NewCart-Paper-1.21.4-Bundle.zip plugins)
      - name: Upload complete plugin bundle
        uses: actions/upload-artifact@v4
        with:
          name: NewCart-Paper-1.21.4-Bundle
          path: NewCart-Paper-1.21.4-Bundle.zip
          if-no-files-found: error
