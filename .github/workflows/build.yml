name: Build NewCart single plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newcart-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Fetch pinned CustomWorldHeight engine for embedding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p libs
          curl --fail --location --retry 3 \
            "https://github.com/Lumine1909/CustomWorldHeight/releases/download/v1.5.1-build-1/CustomWorldHeight-1.5.1-MC-1.20.5-1.21.7.jar" \
            --output libs/CustomWorldHeight.jar
          test -s libs/CustomWorldHeight.jar
          jar tf libs/CustomWorldHeight.jar | grep -q 'io/github/lumine1909/customworldheight/CustomWorldHeight.class'
          jar tf libs/CustomWorldHeight.jar | grep -q 'plugin.yml'
      - name: Verify valid Paper 1.21.4 dimension settings
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^  min-y: -176$' src/main/resources/config.yml
          grep -q '^  height: 496$' src/main/resources/config.yml
          grep -q 'NEW_BOTTOM = -176' src/main/java/ru/soscreate/newcart/NewCartPlugin.java
          grep -q 'NEW_HEIGHT = 496' src/main/java/ru/soscreate/newcart/NewCartPlugin.java
          grep -q 'BEDROCK_Y = -164' src/main/java/ru/soscreate/newcart/NewCartPlugin.java
          grep -q 'DEEPSLATE_START = -163' src/main/java/ru/soscreate/newcart/NewCartPlugin.java
          grep -q 'CustomWorldHeight.plugin = this' src/main/java/ru/soscreate/newcart/NewCartPlugin.java
      - name: Build one self-contained NewCart plugin
        run: gradle --no-daemon clean build
      - name: Verify single-plugin output
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -name 'NewCart-*.jar' -print -quit)"
          test -n "$JAR"
          jar tf "$JAR" | grep -q 'ru/soscreate/newcart/NewCartPlugin.class'
          jar tf "$JAR" | grep -q 'io/github/lumine1909/customworldheight/CustomWorldHeight.class'
          jar tf "$JAR" | grep -q 'io/github/lumine1909/customworldheight/data/DataHandler_1_21_3.class'
          test "$(jar tf "$JAR" | grep -c '^plugin.yml$')" -eq 1
          mkdir -p dist/plugins
          cp "$JAR" dist/plugins/
          (cd dist && zip -r ../NewCart-Paper-1.21.4-Single-Plugin.zip plugins)
          unzip -t NewCart-Paper-1.21.4-Single-Plugin.zip
      - name: Smoke-test on Paper 1.21.4 with an already-created world
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-paper
          curl --fail --location --retry 3 \
            "https://api.papermc.io/v2/projects/paper/versions/1.21.4/builds/232/downloads/paper-1.21.4-232.jar" \
            --output smoke-paper/paper.jar
          cd smoke-paper
          printf 'eula=true\n' > eula.txt
          cat > server.properties <<'PROPERTIES'
          level-name=world
          server-port=25565
          online-mode=false
          spawn-protection=0
          max-players=1
          view-distance=2
          simulation-distance=2
          PROPERTIES
          run_server() {
            local log_file="$1"
            local expected="$2"
            rm -f server.stdin
            mkfifo server.stdin
            java -Xms512M -Xmx1G -jar paper.jar --nogui < server.stdin > "$log_file" 2>&1 &
            local server_pid=$!
            exec 3>server.stdin
            local ready=0
            for _ in $(seq 1 180); do
              if grep -q "$expected" "$log_file"; then ready=1; break; fi
              if ! kill -0 "$server_pid" 2>/dev/null; then
                cat "$log_file"
                exit 1
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              cat "$log_file"
              kill "$server_pid" 2>/dev/null || true
              exit 1
            fi
            echo stop >&3
            exec 3>&-
            wait "$server_pid"
            rm -f server.stdin
          }
          # First boot creates the vanilla 1.21.4 world without NewCart.
          run_server first-start.log "Done ("
          test -d world
          mkdir -p plugins
          cp ../build/libs/NewCart-1.0.4.jar plugins/
          # Second boot proves NewCart can expand that already-existing world.
          run_server newcart-start.log "World height verified: minY=-176 maxY=320"
          grep -q "Migration complete" newcart-start.log
          ! grep -q "Error occurred while enabling NewCart" newcart-start.log
          ! grep -q "height has to be multiple of 16" newcart-start.log
      - name: Upload single-plugin package
        uses: actions/upload-artifact@v4
        with:
          name: NewCart-Paper-1.21.4-Single-Plugin
          path: NewCart-Paper-1.21.4-Single-Plugin.zip
          if-no-files-found: error
