# Single-JAR NewCart configuration.
# The world must be the already existing Paper Overworld folder name (usually "world").
new-cart:
  world: world
  min-y: -176
  height: 496
  logical-height: 384
  cloud-height: default
  dimension-type: overworld
  performance:
    pause-below-tps: 18.0
    full-speed-at-tps: 19.5
    max-layers-per-tick: 2

# Existing and newly loaded chunks are processed in small vertical slices.
# At most two deepslate layers are changed per tick; the TPS guard can reduce this to one or pause it.
