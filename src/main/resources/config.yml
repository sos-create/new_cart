# Single-JAR NewCart configuration.
# The world must be the already existing Paper Overworld folder name (usually "world").
new-cart:
  world: world
  min-y: -176
  height: 496
  logical-height: 384
  cloud-height: default
  dimension-type: overworld

# Existing and newly loaded chunks are processed in small vertical slices.
# The plugin changes two deepslate layers per server tick to avoid freezes.
